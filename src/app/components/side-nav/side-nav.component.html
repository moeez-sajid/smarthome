<div class="side-nav" [class.mobile-open]="isMobileOpen">
  <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle Menu">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <div class="nav-content" [class.mobile-open]="isMobileOpen">
    <div class="categories-section">
      <div class="header">
        <h3>Categories</h3>
        <button class="expand-btn" (click)="toggleExpand()">
          <svg [class.expanded]="isExpanded" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>

      <div class="categories-list" [class.expanded]="isExpanded">
        <button class="view-all" [class.active]="selectedCategory === null" (click)="selectCategory(null)">
          View All
        </button>
        <button *ngFor="let category of categories" [class.active]="selectedCategory === category._id"
          (click)="selectCategory(category._id)">
          {{ category.name }}
        </button>
      </div>
    </div>

    <!-- Sidenav Ad Space -->
    <div class="ad-container">
      <div class="ad-placeholder">
        <script async
          src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5751962178212406"
          crossorigin="anonymous"></script>
        <!-- left -->
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5751962178212406"
          data-ad-slot="8193374651" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>
          (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
      </div>
    </div>

    <div class="table-of-contents" *ngIf="tableOfContents.length > 0">
      <h3>Table of Contents</h3>
      <ul>
        <li *ngFor="let item of tableOfContents">
          <a [routerLink]="[]" [fragment]="item.id">
            {{ item.text }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
